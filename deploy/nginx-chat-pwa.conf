server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # El service worker y el HTML NUNCA se cachean: así las actualizaciones de la PWA
  # llegan al toque (si el proxy cachea sw.js, los clientes quedan pegados a una versión vieja).
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Manifest DINÁMICO por sesión (same-origin): la PWA apunta acá con ?t=token&s=slug para que la
  # app instalada en iPhone abra logueada. Se proxea al backend (app:4000). resolver = DNS de Docker,
  # con variable en proxy_pass para resolver en runtime (no rompe si app arranca después).
  location = /session-manifest {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $manifest_upstream "http://app:4000";
    proxy_pass $manifest_upstream/api/chat/manifest$is_args$args;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store";
  }

  # Assets con hash en el nombre -> cache largo e inmutable.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Fallback SPA: /i/:code, /login, /chat son rutas del cliente -> siempre index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
